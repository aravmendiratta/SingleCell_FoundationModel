model:
  hidden_size: 256
  num_hidden_layers: 4
  num_attention_heads: 4
  intermediate_size: 512
  max_position_embeddings: 8192

training:
  learning_rate: 0.0002
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  num_train_epochs: 3
  weight_decay: 0.01

data:
  dataset_name: "pbmc3k"
  data_dir: "../data"
  do_pretrain: true
  test_size: 0.2
  seed: 42
